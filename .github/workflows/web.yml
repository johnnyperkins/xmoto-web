name: Web

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  EMSDK_VERSION: 6.0.13

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Also keeps the Emscripten ports built by the first run.
      - name: Retrieve emsdk cache
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('web/build.sh') }}
          restore-keys: emsdk-${{ env.EMSDK_VERSION }}-

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Retrieve libxml2 cache
        id: libxml2-cache
        uses: actions/cache@v4
        with:
          path: build-web/deps/prefix
          key: libxml2-${{ env.EMSDK_VERSION }}-${{ hashFiles('web/build-deps.sh') }}

      - name: Build libxml2
        if: steps.libxml2-cache.outputs.cache-hit != 'true'
        run: |
          source ~/emsdk/emsdk_env.sh
          web/build-deps.sh

      - name: Build
        run: |
          source ~/emsdk/emsdk_env.sh
          web/build.sh

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-web/dist

  # Opt-in: set the repository variable XM_WEB_DEPLOY to "true" and choose
  # "GitHub Actions" as the Pages source in the repository settings. Runs on
  # pushes and manual runs of the default branch.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      vars.XM_WEB_DEPLOY == 'true' && github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
